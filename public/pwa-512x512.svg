<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- House Outline with Sparkle / Broom inside -->
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roof -->
    <path d="M120 230 L256 120 L392 230" />
    <!-- Walls -->
    <path d="M150 210 L150 380 Q150 400 170 400 L342 400 Q362 400 362 380 L362 210" />
    <!-- Door -->
    <path d="M220 400 L220 310 Q220 295 235 295 L277 295 Q292 295 292 310 L292 400" />
  </g>

  <!-- Big Checkmark -->
  <circle cx="360" cy="150" r="48" fill="#10b981" />
  <path d="M336 150 L352 166 L384 134" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
